name: Rails

on:
  push:
    branches: [staging, master]
  pull_request:
    branches: [staging, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUBY_VERSION: '3.0.1'
  NODE_VERSION: '14.21.3'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_USER: rails_github_actions
          POSTGRES_DB: rails_github_actions_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rails_github_actions -d rails_github_actions_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      CAFEPHILO_V3_DATABASE_TEST_NAME: rails_github_actions_test
      CAFEPHILO_V3_DATABASE_TEST_USER: rails_github_actions
      CAFEPHILO_V3_DATABASE_TEST_PASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libcurl4-openssl-dev \
            libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run RuboCop
        run: bundle exec rubocop app lib spec

      - name: Set up test database
        run: bundle exec rake db:create db:migrate

      - name: Run tests
        run: bundle exec rspec

  deploy_staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    if: github.ref_name == 'staging'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Deploy
        uses: miloserdow/capistrano-deploy@master
        with:
          target: staging
          deploy_key: ${{ secrets.CAP_SSH_KEY_PASS }}
          enc_rsa_key_pth: config/deploy_id_rsa_enc

  deploy_prod:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    if: github.ref_name == 'master'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Deploy
        uses: miloserdow/capistrano-deploy@master
        with:
          target: production
          deploy_key: ${{ secrets.CAP_SSH_KEY_PASS }}
          enc_rsa_key_pth: config/deploy_id_rsa_enc
